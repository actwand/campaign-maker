<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Maker</title>
    <style>
        /* CSS ഇവിടെ ചേർക്കുക */
        body { font-family: sans-serif; text-align: center; background: #eee; }
        #capture-area { 
            position: relative; width: 300px; height: 300px; 
            margin: 20px auto; background: white; overflow: hidden;
        }
        #frame-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; 
        }
        #user-photo { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; 
        }
        input, button { margin-top: 20px; padding: 10px; width: 80%; }
    </style>
</head>
<body>

    <h2>ഫോട്ടോ സെറ്റ് ചെയ്യുക</h2>
    <div id="capture-area">
        <img id="frame-overlay" src="https://github.com/actwand/campaign-maker/raw/refs/heads/main/Picsart_26-03-27_20-22-11-879.png" alt="Frame">
        <img id="user-photo" src="" style="display:none;">
    </div>

    <input type="file" id="upload-photo" accept="image/*">
    <button id="download-btn">സേവ് ചെയ്യുക</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // JavaScript ഇവിടെ ചേർക്കുക
        const uploadInput = document.getElementById('upload-photo');
        const userPhoto = document.getElementById('user-photo');
        const downloadBtn = document.getElementById('download-btn');

        uploadInput.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userPhoto.src = event.target.result;
                userPhoto.style.display = 'block';
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        downloadBtn.addEventListener('click', function() {
            const area = document.getElementById('capture-area');
            html2canvas(area, { useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'campaign.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        });
    </script>
</body>
</html>
