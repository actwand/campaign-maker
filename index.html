<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Campaign Frame Maker</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 { color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 22px; }

        /* ഫ്രെയിമും ഫോട്ടോയും ഇരിക്കുന്ന പ്രധാന ഭാഗം */
        .canvas-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 20px;
            border: 2px solid #ddd;
            background-color: #f8f9fa;
            overflow: hidden; /* ഫോട്ടോ പുറത്തേക്ക് പോകാതിരിക്കാൻ */
        }

        /* 1. Croppie എലമെന്റ് (താഴത്തെ ലെയർ - ഫോട്ടോ അഡ്ജസ്റ്റ് ചെയ്യാൻ) */
        #cropper-1 {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Croppie-യുടെ ഡിഫോൾട്ട് ബോർഡറുകൾ ഒഴിവാക്കാൻ */
        .cr-boundary { border: none !important; }
        .cr-viewport { border: none !important; box-shadow: none !important; }

        /* 2. ഫ്രെയിം (മുകളിലെ ലെയർ - സുതാര്യമായ PNG) */
        #frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* ഫോട്ടോയ്ക്ക് മുകളിൽ */
            pointer-events: none; /* ഫ്രെയിമിൽ തൊടുമ്പോൾ അടിയിലുള്ള ഫോട്ടോ നീങ്ങാൻ */
            display: block;
        }

        /* ബട്ടണുകളും ഇൻപുട്ടുകളും */
        .controls { margin-top: 15px; }
        
        input[type="file"] { display: none; }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-upload {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
        .btn-upload:hover { background-color: #d2e3fc; }

        .btn-download {
            background-color: #28a745;
            color: white;
        }
        .btn-download:hover { background-color: #218838; }
        .btn-download:disabled { background-color: #6c757d; cursor: not-allowed; }

        .info-text { font-size: 12px; color: #666; margin-top: -5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ക്യാമ്പയിൻ ഫ്രെയിം</h2>
        
        <p class="info-text">ഫോട്ടോ അപ്‌ലോഡ് ചെയ്ത ശേഷം വിരൽ ഉപയോഗിച്ച് വലിപ്പം കൂട്ടുകയോ (Zoom) നീക്കുകയോ (Drag) ചെയ്യാം.</p>

        <div class="canvas-container" id="capture-area">
            <img id="frame-overlay" src="frame.png" crossorigin="anonymous" alt="Frame">
            
            <div id="cropper-1"></div>
        </div>

        <div class="controls">
            <label for="upload-photo" class="btn btn-upload">ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
            <input type="file" id="upload-photo" accept="image/*">
            
            <button id="download-btn" class="btn btn-download" disabled>ഡൗൺലോഡ് ചെയ്ത് സേവ് ചെയ്യുക</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const uploadInput = document.getElementById('upload-photo');
        const downloadBtn = document.getElementById('download-btn');
        const cropperElement = document.getElementById('cropper-1');
        let croppieInstance = null;

        // 1. Croppie ലൈബ്രറി ഇനിഷ്യലൈസ് ചെയ്യുക
        function initCroppie() {
            croppieInstance = new Croppie(cropperElement, {
                viewport: { width: 320, height: 320, type: 'square' }, // ഫ്രെയിമിന്റെ അതേ വലിപ്പം
                boundary: { width: 320, height: 320 },
                showZoomer: false, // മൊബൈലിൽ പിഞ്ച് ചെയ്ത് സൂം ചെയ്യാം
                enableOrientation: true,
                mouseWheelZoom: true
            });
        }

        // 2. ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുമ്പോൾ Croppie-ലേക്ക് ലോഡ് ചെയ്യുക
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    if (!croppieInstance) initCroppie(); // ആദ്യത്തെ തവണ മാത്രം ഇനിഷ്യലൈസ് ചെയ്യുക
                    
                    croppieInstance.bind({
                        url: event.target.result
                    }).then(() => {
                        downloadBtn.disabled = false; // ഫോട്ടോ വന്നാൽ ഡൗൺലോഡ് ബട്ടൺ എനേബിൾ ചെയ്യുക
                    });
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. ഫ്രെയിമും അഡ്ജസ്റ്റ് ചെയ്ത ഫോട്ടോയും ഒന്നിച്ചു ഡൗൺലോഡ് ചെയ്യാൻ
        downloadBtn.addEventListener('click', function() {
            if (!croppieInstance) return;

            // ബട്ടൺ താൽക്കാലികമായി മാറ്റാം
            downloadBtn.innerText = "പ്രോസസ്സ് ചെയ്യുന്നു...";
            downloadBtn.disabled = true;

            const area = document.getElementById('capture-area');
            
            // html2canvas ഉപയോഗിച്ച് സ്ക്രീൻഷോട്ട് എടുക്കുക
            html2canvas(area, {
                useCORS: true,       // സുരക്ഷാ പ്രശ്നങ്ങൾ ഒഴിവാക്കാൻ
                scale: 2,            // ഉയർന്ന ക്വാളിറ്റിക്കായി
                backgroundColor: null // ട്രാൻസ്‌പരൻസി നിലനിർത്താൻ
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'campaign-photo.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                // ബട്ടൺ പഴയപടിയാക്കാൻ
                downloadBtn.innerText = "ഡൗൺലോഡ് ചെയ്ത് സേവ് ചെയ്യുക";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("Error generating image: ", err);
                alert("ക്ഷമിക്കണം, ഡൗൺലോഡ് ചെയ്യുന്നതിൽ പ്രശ്നമുണ്ട്.");
                downloadBtn.disabled = false;
                downloadBtn.innerText = "ഡൗൺലോഡ് ചെയ്ത് സേവ് ചെയ്യുക";
            });
        });
    </script>
</body>
</html>
