<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasa Campaign Maker 2026</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Meera', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            overflow: hidden;
        }

        /* സ്ക്രോളിംഗ് നോട്ടീസ് പരിഷ്കരിച്ചത് */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: #d32f2f; 
            color: white;
            padding: 15px 0; /* പട്ടയുടെ വീതി (Height) കൂട്ടി */
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            font-size: 20px; /* അക്ഷരങ്ങളുടെ വലിപ്പം കൂട്ടി */
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .canvas-container {
            position: relative;
            width: 320px; 
            height: 400px; 
            margin: 0 auto 20px;
            border: 2px solid #eee;
            background-color: #fff;
            overflow: hidden;
        }

        #cropper-1 {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: fill;
        }

        #user-name-display {
            position: absolute;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            z-index: 20;
            font-size: 18px;
            font-weight: 800;
            color: #1a1a1a;
            text-align: center;
            pointer-events: none;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-upload { background-color: #e3f2fd; color: #1976d2; }
        .btn-download { background-color: #2e7d32; color: white; }
        .btn-download:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div class="ticker-wrap">
            <div class="ticker">
                അഡ്മിഷൻ 2026 മാർച്ച് 28, 29(ശനി,ഞായർ) തീയതികളിൽ രാവിലെ 7 മുതൽ 9:00 വരെ... സ്വാഗതം!
            </div>
        </div>

        <div class="canvas-container" id="capture-area">
            <div id="user-name-display"></div>
            <img id="frame-overlay" src="frame.png" crossorigin="anonymous" alt="Campaign Frame">
            <div id="cropper-1"></div>
        </div>

        <div class="controls">
            <input type="text" id="name-input" class="input-box" placeholder="നിങ്ങളുടെ പേര് ഇവിടെ ടൈപ്പ് ചെയ്യുക" maxlength="30">
            <label for="upload-photo" class="btn btn-upload">ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
            <input type="file" id="upload-photo" style="display:none;" accept="image/*">
            <button id="download-btn" class="btn btn-download" disabled>ഫോട്ടോ സേവ് ചെയ്യുക</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const nameInput = document.getElementById('name-input');
        const nameDisplay = document.getElementById('user-name-display');
        const uploadInput = document.getElementById('upload-photo');
        const downloadBtn = document.getElementById('download-btn');
        const cropperElement = document.getElementById('cropper-1');
        let croppieInstance = null;

        nameInput.addEventListener('input', function() {
            nameDisplay.innerText = this.value;
        });

        function initCroppie() {
            croppieInstance = new Croppie(cropperElement, {
                viewport: { width: 190, height: 190, type: 'circle' },
                boundary: { width: 320, height: 400 },
                showZoomer: false,
                mouseWheelZoom: true,
                enableOrientation: true
            });
        }

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    if (!croppieInstance) initCroppie();
                    croppieInstance.bind({ url: event.target.result }).then(() => {
                        downloadBtn.disabled = false;
                    });
                }
                reader.readAsDataURL(file);
            }
        });

        downloadBtn.addEventListener('click', function() {
            const area = document.getElementById('capture-area');
            downloadBtn.innerText = "തയ്യാറാകുന്നു...";
            downloadBtn.disabled = true;

            html2canvas(area, {
                useCORS: true,
                scale: 3, 
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Madrasa_Campaign_2026.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                downloadBtn.innerText = "ഫോട്ടോ സേവ് ചെയ്യുക";
                downloadBtn.disabled = false;
            }).catch(err => {
                alert("പ്രശ്നമുണ്ടായി, വീണ്ടും ശ്രമിക്കുക.");
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
